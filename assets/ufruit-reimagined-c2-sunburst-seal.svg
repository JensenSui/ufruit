<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <style>
      .cls-seal-ring { fill: none; stroke: #334155; stroke-width: 3; opacity: 0.25; }
      .cls-seal-inner { fill: none; stroke: #fa8f03; stroke-width: 2; stroke-dasharray: 4 6; opacity: 0.6; }
      .cls-u-bg { fill: none; stroke: #64748b; stroke-width: 18; stroke-linecap: round; opacity: 0.12; }
      .cls-r { fill: #fa8f03; }
      .cls-u { fill: #fdb606; }
      .cls-f { fill: #e92934; }
      .cls-t { fill: #677236; }
      .cls-i { fill: #829e2f; }
      .cls-udot1 { fill: #fbb404; }
      .cls-udot2 { fill: #fcb505; }
      .cls-stamp-text { font-family: 'Space Grotesk', 'Inter', -apple-system, sans-serif; font-size: 13.5px; font-weight: 700; letter-spacing: 0.25em; fill: #475569; text-anchor: middle; }
    </style>
  </defs>

  <!-- Reimagined Concept 2: The "Sunburst Seal" / Artisanal Quality Stamp -->
  <g id="seal-outer-frame">
    <!-- Double Circular Border -->
    <circle cx="200" cy="200" r="185" class="cls-seal-ring" />
    <circle cx="200" cy="200" r="175" class="cls-seal-inner" />
    <!-- Botanical leaf accents on seal ring -->
    <path d="M 190,15 Q 200,5 210,15" fill="none" stroke="#677236" stroke-width="3" stroke-linecap="round"/>
    <path d="M 190,385 Q 200,395 210,385" fill="none" stroke="#829e2f" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Circular Text Frame Top & Bottom -->
  <path id="textPathTop" d="M 50,200 A 150,150 0 0,1 350,200" fill="none" />
  <path id="textPathBottom" d="M 350,200 A 150,150 0 0,1 50,200" fill="none" />

  <text class="cls-stamp-text" dy="-10">
    <textPath href="#textPathTop" startOffset="50%">ARTISANAL HARVEST • EST. 2026</textPath>
  </text>
  <text class="cls-stamp-text" dy="-10">
    <textPath href="#textPathBottom" startOffset="50%">00 / KUALA LUMPUR • PREMIUM FRUIT</textPath>
  </text>

  <!-- Centered Medallion U Frame -->
  <path class="cls-u-bg" d="M 120,130 L 120,220 C 120,265 155,290 200,290 C 245,290 280,265 280,220 L 280,130" />

